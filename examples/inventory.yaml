# Inventory: the hosts to manage and how to reach them.
#
# Three Debian/Ubuntu servers reached over SSH with a key, as user `regent`
# (allowed to run sudo without a password). Paths are relative to the directory
# where reg is started.

DefaultConnectionMethod: !Ssh2
  AuthMethod: !Key
    Username: regent
    Key:
      SecRef: ./ssh/id_ed25519
      Provider: file
  # Verify the servers' identity (without it, any host key is accepted)
  HostKey: !KnownHostsFile ./ssh/known_hosts

# Variables available to every attribute of the expected state ({{ name }}),
# overridden per host by its HostVars
GlobalVars:
  admin_user: ops
  admin_comment: Operations team
  environment: production
  app_version: "1.27"

Hosts:
  - Id: srv1
    Endpoint: "192.0.2.11:22"
    HostVars:
      hostname: srv1
  - Id: srv2
    Endpoint: "192.0.2.12:22"
    HostVars:
      hostname: srv2
  - Id: srv3
    Endpoint: "192.0.2.13:22"
    HostVars:
      hostname: srv3
      # A staging server, running the next version
      environment: staging
      app_version: "1.28"
